<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLMS_Documents</title>
</head>
<body>
    <div>
        <h1>LLMS</h1>
    </div>
</body>
<style>
    *{
        background-color: rgba(236, 157, 54, 0.393);
        text-align: center;
        color: brown;    
    }
</style>
     <div>
        <h1>Registration Form</h1>
        <form action="./index.html"> <!--action is performed when button inside form is clicked-->
            <label for="name">Enter Your Name : </label>
            <input type="text" placeholder="Enter your name" id="name">
            <br><br>
            <label for="number">Enter Phone Number : </label>
            <input type="text" placeholder="Enter Phone Numbber" id="number">
             <br><br>
            <label for="email">Enter your Email : </label>
            <input type="text" placeholder="Enter your password" id="email">
            <br><br>
            <label for="pass">Enter your password : </label><span style="color: red;">:*</span>
            <input type="password" placeholder="Enter your password" id="pass" required>
            <br><br>
            <label for="date">DOB : </label>
            <input type="date" placeholder="Enter your name" id="DOB">
            <br><br>

            <label for="time">Time : </label>
            <input type="time" placeholder="Enter your name" id="time">
            <br><br>

            <label for="file">upload your resume : </label>
            <input type="file" placeholder="Enter your name" id="file">
            <br><br>

            <label for="doc">Upload your documents : </label>
            <input type="file" placeholder="Enter your name" id="doc">
            <br><br>

            <label for="link">Linkdin URL : </label>
            <input type="url" placeholder="Enter your name" id="link">
            <br><br>

            <label for="name">Gender : </label>
                <label for="male">Male : </label><input type="radio" id="male" value="male" name="gernder">
                <label for="female">Female : </label><input type="radio" id="female" value="female" name="gernder">
                <label for="other">Others : </label><input type="radio" id="other" value="other" name="gernder">
            <br><br>

            <label for="name">Language : </label>
                <label for="eng">English : </label><input type="checkbox" id="eng" value="English" name="Language">
                <label for="marathi">Marathi : </label><input type="checkbox" id="marathi" value="marathi" name="Language" checked>
                <label for="hindi">Hindi : </label><input type="checkbox" id="hindi" value="hindi" name="Language">
                <label for="kannada">Kannada : </label><input type="checkbox" id="kannada" value="kannada" name="Language">
            <br><br>

             <label for="name">Select Your City : </label>
                <select name="city">
                     <option value="" disabled selected>--Select -- </option>
                    <option value="solapur">Solapur</option>
                     <option value="pune">Pune</option>
                      <option value="mumbai">Mumbai</option>
                       <option value="bangluru">Bangluru</option>
                </select>

                <br><br>
                <button>Sumbit</button>
                <input type="submit" value="submit-ip" id="">
        </form>
     </div>
</html>
